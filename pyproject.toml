[tool.uv.workspace]
members = ["services/*", "packages/*", "functions/*"]
# These functions are plain requirements.txt Cloud Functions without pyproject.toml;
# uv requires every glob-matched member to be a project, so exclude them.
exclude = [
  "functions/heartbeat-ingress",
  "functions/heartbeat-receiver",
  "functions/next-song-updater",
]

[tool.uv.sources]
pulsefm-models = { workspace = true }
pulsefm-encoder = { workspace = true }
pulsefm-worker = { workspace = true }
pulsefm-auth = { workspace = true }
pulsefm-redis = { workspace = true }
pulsefm-pubsub = { workspace = true }
pulsefm-vote-api = { workspace = true }
pulsefm-descriptors = { workspace = true }
pulsefm-tasks = { workspace = true }
pulsefm-playback-service = { workspace = true }
pulsefm-playback-stream = { workspace = true }
pulsefm-modal-dispatch-service = { workspace = true }
