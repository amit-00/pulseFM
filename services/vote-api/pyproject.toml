[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsefm-vote-api"
version = "0.1.0"
description = "PulseFM vote API service."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.104.1",
  "uvicorn[standard]==0.24.0",
  "pulsefm-redis",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pulsefm_vote_api*"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "fakeredis[lua]>=2.23",
  # starlette 0.27 (pinned via fastapi 0.104.1) still uses httpx.Client(app=...),
  # which httpx 0.28 removed — keep the test client on 0.27.x.
  "httpx>=0.27,<0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
