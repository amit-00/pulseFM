services:
  vote-api:
    build:
      context: ../..
      dockerfile: services/vote-api/Dockerfile
    container_name: pulsefm-vote-api
    ports:
      - "8090:8080"
    environment:
      - PORT=8080
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:-6379}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
