[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsefm-modal-dispatch-service"
version = "0.1.0"
description = "PulseFM modal dispatch service."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.104.1",
  "uvicorn[standard]==0.24.0",
  "modal",
  "pulsefm-descriptors",
  "pulsefm-pubsub",
  "pulsefm-redis",
  "pulsefm-tasks",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "fakeredis[lua]",
  # starlette 0.27 TestClient still passes app= to httpx.Client, removed in httpx 0.28
  "httpx<0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["pulsefm_modal_dispatch_service*"]
